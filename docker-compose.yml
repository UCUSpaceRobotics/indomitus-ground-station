services:
  indomitus_ground_station:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: humble
    image: indomitus-ground-station:humble
    container_name: indomitus_ground_station
    # DDS discovery is multicast and does not cross a docker bridge, so a
    # bridged container cannot see the rover (or the Gazebo sim, which also runs
    # host-networked) even on the same machine. Host networking is what the
    # rover-core containers use; matching it is what makes them peers.
    network_mode: host
    stdin_open: true      # -i
    tty: true             # -t
    privileged: true
    environment:
      # Must match the rover. rover-core's compose files also use 42, but the
      # rover README lists 132 for the Jetson container — check before a field
      # run, nodes on different domains simply never see each other.
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
      # Two ESP32s: the joystick board (joysticks + its own switches) and the
      # button board. Both enumerate as /dev/ttyACM*, order depends on plug-in.
      - JOY_BOARD_PORT=${JOY_BOARD_PORT:-/dev/ttyACM0}
      - BUTTON_BOARD_PORT=${BUTTON_BOARD_PORT:-/dev/ttyACM1}
    volumes:
      - ./:/work:rw
      - ./src:/opt/ws/src:rw
      - /dev:/dev
    group_add:
      - dialout
    # No `ports:` — with host networking a server in the container binds the
    # host's port directly, reachable from localhost and the LAN alike.
    # Publishing a port here would be rejected as incompatible with
    # network_mode: host.

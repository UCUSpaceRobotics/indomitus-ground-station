; Rover-side LoRa endpoint: ESP32-S3-DevKitC-1 + EBYTE E32-433T30D.
;
; Stands in for the Jetson until the real rover side exists. The mast side is
; not an ESP32 at all - its E32 is wired into the Raspberry Pi 5's GPIO header
; and driven by mast/lora_bridge.py.
;
; Unlike e32-lora-chat this project pulls in no LoRa library. The module is
; transparent in mode 0, so the data path is plain Serial1 reads and writes,
; and the config path is six documented bytes - see README.md. Talking to it
; directly is what lets CFG? print the raw register hex that the bring-up
; procedure checks against.
;
; Build/upload:  pio run -t upload -t monitor

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; PlatformIO project for the PC-side node: ESP32 + EBYTE E32-433T30D.
; The Raspberry Pi 5 node does NOT use an ESP32 - its E32 is wired straight
; into the Pi's GPIO header and driven by the Python script in pi/chat.py.
;
; Build/upload:  pio run -t upload -t monitor

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/xreef/LoRa_E32_Series_Library.git
build_flags = -D NODE_NAME=\"PC\"

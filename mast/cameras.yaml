# mast/cameras.yaml — the concrete list of cameras this rover carries.
#
# Each entry under `cameras` maps a friendly camera name to the udev symlink
# for that camera — NOT /dev/videoN, since node numbers move across replugs
# and symlinks don't. start-cameras.sh uses the name for:
#
#   the stream URL:       http://<jetson>:<port>/<name>?action=stream
#   the remote log file:  /tmp/camera_mjpeg_<name>.log
#
# so keep names short and URL-safe (letters, digits, - and _; no spaces).
#
# `device` is required. `res`, `fps`, `quality`, and `format` are optional per
# camera — omit any of them to fall back to start-cameras.sh's --res/--fps/
# --quality/--format (or their env vars). Useful when different camera models
# on the same rover want different settings.
#
# `format` is the V4L2 capture pixel format (FourCC) — what the sensor
# actually hands over before it gets JPEG-encoded for the stream. Defaults to
# YUYV, right for the Arducams (their only option), but wrong for anything
# that doesn't speak YUYV: a thermal camera is commonly GREY or Y16, a UVC
# camera that natively offers MJPG can be told so, a stereo camera may need
# whatever its combined/side-by-side format is called. Check what a camera
# actually offers with `ssh <jetson> v4l2-ctl -d <device> --list-formats-ext`
# before assuming the default is right.
#
# If `cameras` is empty or this file is missing, start-cameras.sh instead
# auto-discovers every /dev/video* node, as it always used to.
#
# Example, once udev creates these symlinks:
#
# cameras:
#   arducam-mast:
#     device: /dev/arducam-mast
#   arducam-front:
#     device: /dev/arducam-front
#     res: 960x600
#     fps: 10
#     quality: 70
#   arducam-rear:
#     device: /dev/arducam-rear
#     res: 960x600
#     fps: 10
#     quality: 70
#   spectral-camera-front:
#     device: /dev/spectral-camera
#     res: 960x600
#     fps: 10
#     quality: 70
#   thermal-camera-front:
#     device: /dev/thermal-camera
#     format: GREY

cameras:
  zed2i-stereo-camera-front:
    device: /dev/zed2i-stereo-camera
    res: 960x600
    fps: 15
    quality: 70
  arducam-mast:
    device: /dev/arducam-mast
    res: 640x360
    fps: 10
    quality: 70
  arducam-front:
    device: /dev/arducam-front
    res: 800x480
    fps: 10
    quality: 70
  arducam-rear:
    device: /dev/arducam-rear
    res: 800x480
    fps: 10
    quality: 70
  arm-camera:
    device: /dev/arm-camera
    res: 640x360
    fps: 15
    quality: 70
  spectral-camera-front:
    device: /dev/spectral-camera
    res: 960x600
    fps: 10
    quality: 70
  thermal-camera-front:
    device: /dev/thermal-camera
    fps: 5
    quality: 50
# Put the Alfa AWUS036ACH into USB 3.0 mode on the Jetson Nano.
#
# The adapter is a USB 3.0 device that comes up in USB 2.0 mode unless told
# otherwise, and 480M caps the link well below what the radio can do. See
# "The Alfa must be switched into USB3 mode — it is not a port problem" in
# mast/README.md.
#
# Both module names are listed because the option only applies to the module
# actually loaded, and this rover has swapped between builds before:
#   88XXau  - aircrack-ng build (what this Nano runs today, v5.6.4.2)
#   8812au  - morrownr build (NOT usable on this kernel; see mast/README.md)
#
# rtw_power_mgnt=0 is already the running default here, but state it: power
# saving costs about a third of the throughput and all of the latency
# stability, and a default is not a guarantee.
#
# Install with mast/alfa-usb3.sh, which arms a rollback first. Do NOT just copy
# this into place and reboot — switching USB mode re-enumerates the adapter,
# and the adapter is the only way into this rover (no wired lifeline is
# configured on this Nano).
options 88XXau rtw_switch_usb_mode=1 rtw_power_mgnt=0
options 8812au rtw_switch_usb_mode=1 rtw_power_mgnt=0

# hostapd AP for the rover Alfa (RTL8812AU, morrownr 8812au) — 40 MHz on ch36.
#
# Replaces the NetworkManager `Hotspot` profile, which is capped at 20 MHz
# because NM 1.36 exposes no channel-width property for AP mode. Reproduces the
# NM profile exactly except for the width: same SSID, same WPA2-PSK, same
# channel, same 10.42.0.1/24.
#
# ht_capab / vht_capab are morrownr's documented values for this chip, quoted
# from the "Band 2 (5 GHz)" block in /etc/modprobe.d/8812au.conf on the rover.
# Do not invent these — the vendor driver populates nl80211 phy info only
# partially (`iw phy phy0 info` returns nothing), so hostapd cannot infer them.
#
# HT40+ on ch36 bonds 36+40, so the control channel is 36 and the 40 MHz centre
# is ch38. vht_oper_chwidth=0 means "20 or 40 MHz" — this is VHT40, matching the
# 400/324 Mbit/s PHY row in STARTUP.md, not VHT80.

interface=wlx00c0caba86c1
driver=nl80211
ssid=ERC_UCUSpaceRobotics_A

hw_mode=a
channel=36

# Regulatory. Drop these two lines if hostapd refuses to start — a mismatched
# regdomain is a common cause, and ch36 is permitted essentially everywhere.
country_code=UA
ieee80211d=1

ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40][MAX-AMSDU-7935]

ieee80211ac=1
vht_capab=[MAX-MPDU-11454][SHORT-GI-80][TX-STBC-2BY1][RX-STBC-1][HTC-VHT][MAX-A-MPDU-LEN-EXP7]
vht_oper_chwidth=0
vht_oper_centr_freq_seg0_idx=38

wmm_enabled=1

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# Same passphrase the Pi's netplan already stores in plaintext (99-mast.yaml).
wpa_passphrase=19283746
